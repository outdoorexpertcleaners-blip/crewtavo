<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F1" />
    <title>Outdoor Expert</title>
    <meta name="description" content="Outdoor Expert: quotes, scheduling, field work and invoicing. Based on Crewtavo." />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Added to an iPhone's Home Screen: its name there, and the status bar above the page rather than over it (a see-through one has white text, lost on the light theme). -->
    <meta name="apple-mobile-web-app-title" content="Outdoor Expert" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The page's own color (--page in src/styles/tokens.css) from the first paint, so opening the app never flashes white in dark mode. -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #111110; color-scheme: dark; }
      /* A booking form inside the business's own website (?embed=1) sits on that site's background, with no Crewtavo logo while it loads. */
      html.embedded, html.embedded body { background: transparent; }
      html.embedded .boot { display: none; }
    </style>
    <script>
      // Light or dark before first paint (src/lib/theme.ts keeps it up to date): light unless dark or
      // "follow the device" was picked. Client pages stay light.
      try {
        var theme = localStorage.getItem("crewtavo.theme");
        if (!/^\/(hub|book|u|refer|s)\//.test(location.pathname) && (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches))) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#191918");
        }
      } catch (e) {}
      // The language chosen on this phone (src/lib/i18n.tsx), for screen readers from the start.
      try {
        if (localStorage.getItem("crewtavo.locale") === "es" && !/^\/(hub|book|u|refer|s)\//.test(location.pathname)) document.documentElement.lang = "es";
      } catch (e) {}
      if (/^\/book\//.test(location.pathname) && /[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add("embedded");
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <span class="boot-mark" aria-hidden="true"></span>
      </div>
    </div>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
      .boot-mark { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #d0d7e2; border-top-color: #1d4ed8; animation: boot 0.9s linear infinite; }
      @keyframes boot { to { transform: rotate(360deg); } }
      .dark .boot { background: #111110; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
